<div ng-controller="ImageCrop.MediaCropDetailsController as vm">
    <umb-editor-view>

        <umb-editor-header name="model.title" name-locked="true" hide-alias="true" hide-icon="true" hide-description="true">
        </umb-editor-header>

        <umb-editor-container>

            <div class="umb-control-group" ng-if="model.target">
                <div ng-if="vm.hasCrops">
                    <h5>
                        <localize key="@general_cropSection">Crop section</localize>
                    </h5>

                    <div class="umb-property-editor umb-radiobuttons">
                        <ng-form name="radioButtonsFieldForm">

                            <ul class="inline">
                                <li ng-repeat="alias in vm.CropAliasSelection">
                                    <umb-radiobutton name="selectedCrop_{{vm.uniqueId}}" on-change="vm.selectCrop(alias)" value="{{alias}}" model="vm.selectedCropAlias" text="{{alias}}">
                                    </umb-radiobutton>
                                </li>
                            </ul>

                        </ng-form>
                    </div>

                    <div>
                        <umb-image-crop 
                            height="{{vm.cropSize.height}}" 
                            width="{{vm.cropSize.width}}" 
                            crop="vm.selectedCrop.coordinates" 
                            center="vm.focalPoint" 
                            src="vm.imageSrc">
                        </umb-image-crop>
                    </div>
                    <div>
                        <button type="button" class="btn btn-link" ng-click="vm.reset()">
                            <localize key="imagecropper_reset" class="ng-isolate-scope">Reset crop</localize>
                        </button>
                    </div>
                </div>

            </div>

            <div class="umb-control-group" ng-if="model.target">
                <h5>
                    <localize key="@content_altTextOptional">Alternative text (optional)</localize>
                </h5>
                <input type="text" class="umb-property-editor umb-textstring" ng-model="vm.altText" umb-auto-focus />
            </div>

            <div class="umb-control-group" ng-if="model.target">
                <h5>
                    <localize key="@content_captionTextOptional">Caption (optional)</localize>
                </h5>
                <input type="text" class="umb-property-editor umb-textstring" ng-model="vm.caption" />
            </div>

        </umb-editor-container>

        <umb-editor-footer>
            <umb-editor-footer-content-right>

                <umb-button action="vm.close()" button-style="link" shortcut="esc" label-key="general_close" type="button">
                </umb-button>

                <umb-button button-style="success" label-key="buttons_select" type="button" disabled="model.selection.length === 0" action="vm.submit(model)">
                </umb-button>

            </umb-editor-footer-content-right>
        </umb-editor-footer>

    </umb-editor-view>
</div>
